
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Execution Report</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    h1 { margin-top: 0; text-align: center; }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 2rem 0;
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: 12px;
    }
    .stat-box { text-align: center; }
    .stat-number { font-size: 1.8rem; font-weight: bold; }
    .passed { color: #4ade80; }
    .failed { color: #f87171; }
    .test-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .test-header { display: flex; justify-content: space-between; align-items: center; }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge-passed { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
    .badge-failed { background: rgba(248, 113, 113, 0.2); color: #f87171; }
    pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Execution Results</h1>
    <div class="stats">
      <div class="stat-box"><div class="stat-number">2</div>Total</div>
      <div class="stat-box"><div class="stat-number passed">2</div>Passed</div>
      <div class="stat-box"><div class="stat-number failed">0</div>Failed</div>
      <div class="stat-box"><div class="stat-number">7.42s</div>Duration</div>
    </div>
    <div class="tests">
      
        <div class="test-card">
          <div class="test-header">
            <span><strong>Should perform accurate floating-point currency sum of transfers</strong> (5247ms)</span>
            <span class="badge badge-passed">PASSED</span>
          </div>
          
        </div>
      
        <div class="test-card">
          <div class="test-header">
            <span><strong>Headless REST API schema and transaction state validation</strong> (692ms)</span>
            <span class="badge badge-passed">PASSED</span>
          </div>
          
        </div>
      
    </div>
  </div>
</body>
</html>
